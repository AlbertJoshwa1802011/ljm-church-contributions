name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  # Deploy is gated on this job passing — see CONTRIBUTING.md "CI is a deploy
  # gate, not a suggestion". Do not remove this job or the deploy job's
  # `needs: test`; that link is what makes a red suite actually block production.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run test suite
        run: npm test

  # 0023 is idempotent (UPDATE display name + INSERT OR IGNORE). It lives here
  # rather than apply-d1-migration.yml because that workflow is workflow_dispatch
  # only, and the GitHub App token this repo's agents use cannot dispatch it.
  # Same CLOUDFLARE_API_TOKEN as the deploy job — Pages deploy already proved
  # the token can talk to this account.
  migrate:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply D1 migration 0023 (Christmas Fund 2k26)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute ljm-contributions-db --remote --file=./migrations/0023_christmas_fund_2k26.sql

      - name: Verify Christmas Fund rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute ljm-contributions-db --remote --command="SELECT slug, name, goal_amount, is_system FROM funds WHERE slug IN ('christmas-fund','christmas-fund-2k26') ORDER BY slug;"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        # cloudflare/pages-action was removed on 2026-09-18 (CVE-2026-11325).
        # wrangler-action is the supported replacement.
        # --commit-dirty=true: wrangler-action's `npm i wrangler` dirties the
        # working tree; without this flag wrangler only warns, but keep it
        # explicit so a future wrangler release cannot turn the warning into a fail.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=light-of-jesus-ministry-contributions --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
